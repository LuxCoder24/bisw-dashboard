<!doctype html>
<html lang="en" class="dashboard-display"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BISW · IB Bulletin</title><meta name="description" content="BISW IB events, deadlines, announcements, and Washington weather."><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><script type="module" src="boot.js"></script><link rel="stylesheet" href="display.css"></head>
<body><div class="display-shell">
<header class="display-timebar" aria-label="Date and time"><div class="header-date"><div id="date"></div><div class="live-clock"><span id="clock"></span></div></div></header>
<main id="dashboard">

<div class="dashboard-grid">
<section class="panel agenda"><div class="section-heading"><h2>Upcoming events</h2></div><div id="events"><p class="empty-state">Loading events…</p></div><div class="agenda-note" hidden></div></section>
<section class="feature-card"><div class="feature-top"><span class="tag">FEATURED EVENT</span><span class="outline-label">COLLEGE & CAREERS</span></div><div class="feature-content"><h2 id="feature-title">No featured event</h2><p id="feature-description"></p></div><div class="feature-bottom"><div><span id="feature-date"></span><strong id="feature-location"></strong></div></div></section>

<section class="panel weather"><div class="section-heading"><h2>Weather</h2></div><div id="weather-data"><p class="empty-state">Loading weather…</p></div><div class="weather-bottom"><a href="https://www.weather.gov/" target="_blank" rel="noopener">National Weather Service</a></div></section>

</div>
<section class="panel deadlines"><div class="section-heading"><h2>Deadlines</h2></div><div id="deadlines"><p class="empty-state">Loading deadlines…</p></div></section>
<section class="panel buses"><div class="section-heading bus-heading"><h2><svg class="bus-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="16" rx="3"/><path d="M5 11h14M12 4v7M7 19v2m10-2v2M8 15h1m6 0h1"/></svg>Bus arrivals</h2><span id="bus-live" class="bus-live" data-live="false">Connecting</span></div><div id="bus-arrivals"><p class="empty-state">Loading arrivals…</p></div><p id="bus-status" class="bus-status" role="status"></p></section>
</main>
<main id="special-view" hidden></main>
<footer class="display-footer"><div id="connection">Connecting…</div><nav aria-label="Display views"><button id="fullscreen">Full screen</button><a href="admin.html">Staff sign-in</a></nav></footer>
<p id="status" class="status" role="status"></p>
</div></body></html>
